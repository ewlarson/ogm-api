# config/deploy.yml
service: ogm-api
image: ghcr.io/ewlarson/ogm-api

builder:
  arch: amd64

ssh:
  user: ewlarson

servers:
  web:
    hosts:
      - 88.99.148.81

proxy:
  ssl: false
  host: 88.99.148.81

registry:
  server: ghcr.io
  username: ewlarson
  password:
    - KAMAL_REGISTRY_PASSWORD

# ───────────────── ENV passed into *every* web container ────────────────
env:
  clear:
    # new DB credentials (must match paradedb below)
    POSTGRES_USER: ogm_api_user
    POSTGRES_DB:   btaa_ogm_api
    DATABASE_URL: postgresql+asyncpg://ogm_api_user:${POSTGRES_PASSWORD}@ogm-api-postgres:5432/btaa_ogm_api

    OPENSEARCH_URL:        http://elasticsearch:9200
    REDIS_URL:             redis://redis:6379/0
    ELASTICSEARCH_INDEX:   btaa_ogm_api
    REDIS_TTL:             "604800"
    LOG_LEVEL:             DEBUG
    ENDPOINT_CACHE:        "true"
    GAZETTEER_CACHE_TTL:   "3600"
    APP_MODE:              production

  secret:
    - POSTGRES_PASSWORD    # your DB password, see below
    - OPENAI_API_KEY

# ────────────── Accessories (one per Compose service) ──────────────
accessories:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.0.0
    roles: [web]
    env:
      clear:
        discovery.type: single-node
        xpack.security.enabled: "false"
        ES_JAVA_OPTS: "-Xms2g -Xmx2g"
        cluster.routing.allocation.disk.threshold_enabled: "true"
    directories:
      - esdata:/usr/share/elasticsearch/data

  postgres:
    image: postgres:15
    roles: [web]
    env:
      clear:
        POSTGRES_USER: ogm_api_user
        POSTGRES_DB:   btaa_ogm_api
      secret:
        - POSTGRES_PASSWORD

    # only listen on localhost
    port: "127.0.0.1:5432:5432"
    files:
      - config/init.sql:/docker-entrypoint-initdb.d/setup.sql
    directories:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7.2
    roles: [web]
    cmd: redis-server --appendonly yes
    directories:
      - redisdata:/data

  celery:
    image: ghcr.io/ewlarson/ogm-api
    roles: [web]
    cmd: celery -A app.tasks.worker worker --loglevel=INFO
    env:
      secret:
        - OPENAI_API_KEY

  flower:
    image: ghcr.io/ewlarson/ogm-api
    roles: [web]
    cmd: bash -c "cd /app && celery -A app.tasks.worker flower --port=5555"

volumes:
  - esdata
  - pgdata
  - redisdata
