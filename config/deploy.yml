# config/deploy.yml
service: ogm-api
image: ghcr.io/ewlarson/ogm-api

builder:
  arch: amd64

ssh:
  user: ewlarson

servers:
  web:
    hosts:
      - 88.99.148.81

proxy:
  ssl: false
  host: 88.99.148.81

registry:
  server: ghcr.io
  username: ewlarson
  password:
    - KAMAL_REGISTRY_PASSWORD

# ───────────────── ENV passed into *every* web container ────────────────
env:
  clear:
    ELASTICSEARCH_URL:     http://127.0.0.1:9200
    REDIS_URL:             redis://redis:6379/0
    ELASTICSEARCH_INDEX:   btaa_ogm_api
    REDIS_TTL:             "604800"
    LOG_LEVEL:             DEBUG
    ENDPOINT_CACHE:        "true"
    GAZETTEER_CACHE_TTL:   "3600"
    APP_MODE:              production

  secret:
    - DATABASE_URL
    - OPENAI_API_KEY

# ────────────── Accessories (one per Compose service) ──────────────
accessories:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.0.0
    roles: [web]
    env:
      clear:
        discovery.type: single-node
        xpack.security.enabled: "false"
        ES_JAVA_OPTS: "-Xms2g -Xmx2g"
        cluster.routing.allocation.disk.threshold_enabled: "true"
    # only listen on localhost
    port: "127.0.0.1:9200:9200"
    directories:
      - esdata:/usr/share/elasticsearch/data

  postgres:
    image: postgres:15
    roles: [web]
    env:
      clear:
        POSTGRES_USER: ogm_api_user
        POSTGRES_DB:   btaa_ogm_api
      secret:
        - POSTGRES_PASSWORD

    # only listen on localhost
    port: "127.0.0.1:5432:5432"
    files:
      - config/init.sql:/docker-entrypoint-initdb.d/setup.sql
    directories:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7.2
    roles: [web]
    cmd: redis-server --appendonly yes
    directories:
      - redisdata:/data

volumes:
  - esdata
  - pgdata
  - redisdata
